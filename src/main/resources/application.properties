spring.application.name=jobTracker

# Load local settings from the project root; environment variables can override them.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtrackerdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Set to true to insert fictional data at startup.
jobtracker.demo.seed.enabled=${DEMO_SEED_ENABLED:false}
jobtracker.demo.seed.password=${DEMO_SEED_PASSWORD:}
